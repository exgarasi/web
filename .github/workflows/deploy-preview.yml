name: EXGARASI Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exgarasi-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feat/seller-csv-import-persistence'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/seller-csv-import-persistence

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Deploy only the Preview environment
        run: npx wrangler deploy --config wrangler.jsonc --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
